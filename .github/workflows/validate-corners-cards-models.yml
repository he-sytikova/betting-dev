name: Validate corners and yellow-card models

on:
  workflow_dispatch:
  schedule:
    - cron: "31 4 * * 2"
  push:
    branches: [main]
    paths:
      - "scripts/models/build-historical-dataset.py"
      - "scripts/models/train-corners-cards.py"
      - "scripts/models/export-corners-cards-runtime.py"
      - "model-v1.js"
      - "model-v1.html"
      - "index.html"
      - "goals-model.html"
      - "goals-model.js"
      - "styles.css"
      - "data.json"
      - "data/corners_cards_distribution_v1.json"
      - "data/raw/football-data/**"
      - "tests/test_runtime_model_export.py"
      - "tests/test_historical_dataset_builder.py"
      - "tests/test_corners_cards_model_validation.py"
      - "requirements-models.txt"
      - ".github/workflows/validate-corners-cards-models.yml"

permissions:
  contents: read

concurrency:
  group: corners-cards-model-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-models.txt
      - name: Install model dependencies
        run: python -m pip install -r requirements-models.txt
      - name: Validate Python and browser syntax
        run: |
          python -m py_compile scripts/models/build-historical-dataset.py
          python -m py_compile scripts/models/train-corners-cards.py
          python -m py_compile scripts/models/export-corners-cards-runtime.py
          node --check model-v1.js
      - name: Run dataset builder tests
        run: python -m unittest discover -s tests -p "test_historical_dataset_builder.py" -v
      - name: Run model validation tests
        run: python -m unittest discover -s tests -p "test_corners_cards_model_validation.py" -v
      - name: Run runtime export tests
        run: python -m unittest discover -s tests -p "test_runtime_model_export.py" -v
      - name: Build leakage-safe historical dataset
        run: python scripts/models/build-historical-dataset.py
      - name: Train and evaluate experimental count models
        run: python scripts/models/train-corners-cards.py
      - name: Export runtime models and latest team state
        run: |
          python -m py_compile scripts/models/export-corners-cards-runtime.py
          python scripts/models/export-corners-cards-runtime.py
      - name: Upload GitHub Pages site with refreshed runtime model
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Upload validation and runtime artifacts
        uses: actions/upload-artifact@v4
        with:
          name: corners-cards-model-validation
          path: |
            data/corners_cards_model_validation.json
            data/corners_cards_models.json
          retention-days: 30

  deploy:
    needs: validate
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy development preview
        id: deployment
        uses: actions/deploy-pages@v4
