name: Validate non-CSV dev pipeline

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/models/**"
      - "api-consensus.js"
      - "internal-model.js"
      - "goals-internal-model.js"
      - "stats-internal-model.js"
      - "tests/api-consensus.test.cjs"
      - "tests/internal-model.test.cjs"
      - "tests/goals-internal-model.test.cjs"
      - "tests/stats-internal-model.test.cjs"
      - "tests/express-model.test.cjs"
      - "tests/euro-internal-model.test.cjs"
      - "tests/test_build_historical_dataset.py"
      - "tests/test_backtest_closing_odds.py"
      - "tests/test_euro_cl.py"
      - "tests/test_recency_weights.py"
      - "euro-internal-model.js"
      - "express-model.js"
      - "scripts/models/capture-predictions.mjs"
      - "scripts/models/evaluate-ledger-vs-dataset.mjs"
      - "model-v1.js"
      - "goals-model.js"
      - ".github/workflows/validate-corners-cards-models.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate active JavaScript
        run: |
          node --check api-consensus.js
          node --test tests/api-consensus.test.cjs
          node --check internal-model.js
          node --test tests/internal-model.test.cjs
          node --check goals-internal-model.js
          node --test tests/goals-internal-model.test.cjs
          node --check stats-internal-model.js
          node --test tests/stats-internal-model.test.cjs
          node --check express-model.js
          node --test tests/express-model.test.cjs
          node --check euro-internal-model.js
          node --test tests/euro-internal-model.test.cjs
          node --check model-v1.js
          node --check goals-model.js
          node --check scripts/models/archive-provider-results.mjs
          node --check scripts/models/capture-predictions.mjs
          node --check scripts/models/evaluate-ledger-vs-dataset.mjs
      - name: Validate dataset builder (stdlib-only Python)
        run: python3 tests/test_build_historical_dataset.py
      - name: Set up Python for model tests
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python test dependencies
        run: pip install numpy pandas scikit-learn
      - name: Validate backtest and Champions League pipelines
        run: |
          python3 -m unittest tests.test_backtest_closing_odds
          python3 -m unittest tests.test_euro_cl
          python3 -m unittest tests.test_recency_weights
      - name: Confirm CSV pipelines are not used
        run: |
          if find . -type f -name '*.csv' -not -path './.git/*' | grep -q .; then
            echo "CSV files are not allowed in the active dev dataset."
            exit 1
          fi
          echo "No CSV dataset files are present.";
