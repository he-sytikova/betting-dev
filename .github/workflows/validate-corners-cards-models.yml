name: Validate dev model code and tests

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/models/**"
      - "model-v1.js"
      - "goals-model.js"
      - ".github/workflows/validate-corners-cards-models.yml"

permissions:
  contents: read

concurrency:
  group: dev-model-code-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-models.txt
      - name: Install model dependencies
        run: python -m pip install -r requirements-models.txt
      - name: Validate Python and browser syntax
        run: |
          python -m py_compile scripts/models/build-historical-dataset.py
          python -m py_compile scripts/models/train-corners-cards.py
          python -m py_compile scripts/models/export-corners-cards-runtime.py
          node --check model-v1.js
          node --check goals-model.js
          node --check scripts/models/archive-provider-results.mjs
      - name: Run dataset builder tests (code only; no source data ingestion)
        run: python -m unittest discover -s tests -p "test_historical_dataset_builder.py" -v
      - name: Run model validation tests
        run: python -m unittest discover -s tests -p "test_corners_cards_model_validation.py" -v
      - name: Run runtime export tests
        run: python -m unittest discover -s tests -p "test_runtime_model_export.py" -v
      - name: Confirm historical training is intentionally paused
        run: echo "Training/export/deployment is paused pending a source that expressly permits historical retention and model training."
