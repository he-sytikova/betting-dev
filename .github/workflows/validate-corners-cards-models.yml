name: Validate non-CSV dev pipeline

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/models/**"
      - "api-consensus.js"
      - "tests/api-consensus.test.cjs"
      - "model-v1.js"
      - "goals-model.js"
      - ".github/workflows/validate-corners-cards-models.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate active JavaScript
        run: |
          node --check api-consensus.js
          node --test tests/api-consensus.test.cjs
          node --check model-v1.js
          node --check goals-model.js
          node --check scripts/models/archive-provider-results.mjs
      - name: Confirm CSV pipelines are not used
        run: |
          if find . -type f -name '*.csv' -not -path './.git/*' | grep -q .; then
            echo "CSV files are not allowed in the active dev dataset."
            exit 1
          fi
          echo "No CSV dataset files are present.";
