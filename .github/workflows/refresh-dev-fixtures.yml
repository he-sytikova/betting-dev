name: "Обновление календаря и модельного снимка"

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/refresh-dev-fixtures.yml"
  schedule:
    # Keep the dev model's fixture calendar in sync with the public production snapshot.
    - cron: '17 */2 * * *'
    # Game day starts 07:00 Moscow. GitHub's scheduler silently skips a large share
    # of scheduled runs, so the boundary pull is spread across six tickets
    # (07:07-08:47 Moscow, plus 09:17 from the every-2h rule); the precheck step
    # below turns repeated runs into cheap no-ops once the snapshot is current.
    - cron: '7,27,47 4-5 * * *'

permissions:
  contents: write
  actions: write   # цепочный workflow_dispatch для acquire-bookmaker-lines при позднем утреннем refresh

concurrency:
  group: refresh-dev-fixtures
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Precheck — turn dense morning retries (07:00-09:00 Moscow) into no-ops once the snapshot is current
        id: precheck
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const board = require('./daily-board.js');
          const now = Date.now();
          const moscow = new Date(now + 3 * 60 * 60 * 1000);
          const moscowMinute = moscow.getUTCHours() * 60 + moscow.getUTCMinutes();
          const snapshot = JSON.parse(fs.readFileSync('data.json', 'utf8'));
          const gameDay = board.gameDayKeyMsk(now);
          if (process.env.GITHUB_EVENT_NAME === 'schedule'
            && moscowMinute >= 420 && moscowMinute < 540
            && snapshot.date === gameDay) {
            console.log(`Snapshot ${snapshot.date} already matches the active game day; scheduled retry becomes a no-op.`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'fresh=true\n');
          } else {
            console.log(`Full run needed: event=${process.env.GITHUB_EVENT_NAME}, snapshot=${snapshot.date}, game day=${gameDay}, Moscow minute=${moscowMinute}.`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'fresh=false\n');
          }
          NODE

      - name: Download latest production prediction snapshot
        if: steps.precheck.outputs.fresh != 'true'
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --retry 4 --retry-delay 5 \
            https://raw.githubusercontent.com/he-sytikova/betting/main/data.json \
            --output "$RUNNER_TEMP/production-data.json"
          node -e "
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/production-data.json', 'utf8'));
            if (!data.date || !Array.isArray(data.predictions)) {
              throw new Error('Production data.json must contain date and predictions[]');
            }
            const future = data.predictions.filter(item => {
              const time = Date.parse(item.time);
              return Number.isFinite(time) && time > Date.now();
            });
            console.log('Snapshot date:', data.date);
            console.log('Generated at:', data.generatedAt || 'unknown');
            console.log('Prediction records:', data.predictions.length);
            console.log('Upcoming fixture records:', future.length);
          "

      - name: Wait for the 07:01:30 Moscow boundary when a game-day flip is pending
        if: steps.precheck.outputs.fresh != 'true'
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const board = require('./daily-board.js');
          const now = Date.now();
          const moscow = new Date(now + 3 * 60 * 60 * 1000);
          const minute = moscow.getUTCHours() * 60 + moscow.getUTCMinutes();
          if (minute >= 421) {
            console.log('07:01 Moscow already passed; no wait.');
            process.exit(0);
          }
          const downloaded = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/production-data.json', 'utf8'));
          const existing = JSON.parse(fs.readFileSync('data.json', 'utf8'));
          const nextGameDay = board.dayKeyMsk(now);
          if (!(downloaded.date === nextGameDay && existing.date !== nextGameDay)) {
            console.log(`No pending flip (existing=${existing.date}, downloaded=${downloaded.date}, next=${nextGameDay}); no wait.`);
            process.exit(0);
          }
          const waitMs = (421 * 60 + 30) * 1000 - (minute * 60 + moscow.getUTCSeconds()) * 1000;
          const capMs = 225 * 60 * 1000; // не держим раннер дольше 3 ч 45 мин (таймаут job — 6 ч)
          if (waitMs > capMs) {
            console.log(`Wait of ${(waitMs / 60000).toFixed(0)} min exceeds the 225 min cap; leaving the flip to later triggers.`);
            process.exit(0);
          }
          console.log(`Flip to ${downloaded.date} is pending; sleeping ${(waitMs / 60000).toFixed(1)} min until 07:01:30 Moscow.`);
          Atomics.wait(new Int32Array(new SharedArrayBuffer(4)), 0, 0, waitMs);
          console.log('Woke at the 07:01:30 Moscow boundary; proceeding with the flip.');
          NODE

      - name: Keep the active game-day snapshot throughout session 5
        if: steps.precheck.outputs.fresh != 'true'
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const board = require('./daily-board.js');
          const now = Date.now();
          const currentGameDay = board.gameDayKeyMsk(now);
          const downloaded = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/production-data.json', 'utf8'));
          const existing = JSON.parse(fs.readFileSync('data.json', 'utf8'));
          if (board.shouldRetainGameDaySnapshot(existing, downloaded, now)) {
            console.log(`Keeping active game-day snapshot ${existing.date} until 07:00 Moscow; downloaded=${downloaded.date}`);
          } else {
            if (!board.hasFutureFixtures(downloaded, now)) {
              throw new Error('Production snapshot has no upcoming fixtures outside the protected overnight case; refusing to replace dev data');
            }
            fs.copyFileSync(process.env.RUNNER_TEMP + '/production-data.json', 'data.json');
            console.log(`Accepted production snapshot ${downloaded.date}; active game day=${currentGameDay}`);
          }
          NODE

      - name: Watchdog — fail loudly if the snapshot lags the Moscow game day
        if: steps.precheck.outputs.fresh != 'true'
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const board = require('./daily-board.js');
          const now = Date.now();
          const moscow = new Date(now + 3 * 60 * 60 * 1000);
          const moscowMinute = moscow.getUTCHours() * 60 + moscow.getUTCMinutes();
          if (moscowMinute < 430) {
            console.log(`Overnight/session-5 window (Moscow minute ${moscowMinute}); watchdog idle.`);
            process.exit(0);
          }
          const gameDay = board.gameDayKeyMsk(now);
          const snapshot = JSON.parse(fs.readFileSync('data.json', 'utf8'));
          if (snapshot.date !== gameDay) {
            console.error(`STALE SNAPSHOT: data.json is ${snapshot.date}, active Moscow game day is ${gameDay}. Production snapshot is late or a scheduled pull was skipped — check production repo and rerun this workflow.`);
            process.exit(1);
          }
          console.log(`Snapshot ${snapshot.date} matches the active game day ${gameDay}.`);
          NODE

      - name: Fetch Euro365 bookmaker odds for the snapshot day
        if: steps.precheck.outputs.fresh != 'true'
        env:
          EURO365_API_KEY: ${{ secrets.EURO365_API_KEY }}
        run: python3 scripts/models/fetch-euro365-odds.py --data data.json --output data/odds.json

      - name: Publish normalized final results for the Moscow game day
        if: steps.precheck.outputs.fresh != 'true'
        env:
          EURO365_API_KEY: ${{ secrets.EURO365_API_KEY }}
        run: python3 scripts/models/fetch-euro365-results.py --data data.json --output-dir data/results

      - name: Fetch tomorrow fixture list from Euro365 prematch (schedule only, no odds)
        if: steps.precheck.outputs.fresh != 'true'
        env:
          EURO365_API_KEY: ${{ secrets.EURO365_API_KEY }}
        run: python3 scripts/models/fetch-tomorrow-fixtures.py --output data/fixtures-tomorrow.json

      - name: Fetch football-data.co.uk fixtures odds (keyless consensus)
        if: steps.precheck.outputs.fresh != 'true'
        run: python3 scripts/models/fetch-fdo-odds.py --output data/odds-fdo.json

      - name: Archive completed results from non-CSV provider feed
        if: steps.precheck.outputs.fresh != 'true'
        run: node scripts/models/archive-provider-results.mjs

      - name: Commit refreshed schedule and results archive
        if: steps.precheck.outputs.fresh != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          if [ -f data/odds.json ]; then git add data/odds.json; fi
          if [ -f data/fixtures-tomorrow.json ]; then git add data/fixtures-tomorrow.json; fi
          if [ -f data/odds-fdo.json ]; then git add data/odds-fdo.json; fi
          if [ -d data/results-ledger ]; then git add -A data/results-ledger; fi
          if [ -d data/results ]; then git add data/results/*.json; fi
          if git diff --cached --quiet; then
            echo "Fixture snapshot and completed-results archive are already current"
          else
            git commit -m "chore: refresh dev fixtures and archive results"
            git pull --rebase origin main
            git push
          fi

      - name: Chain-dispatch coupon acquisition after late morning refreshes
        if: steps.precheck.outputs.fresh != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          CHAIN=$(node <<'NODE'
          const fs = require('node:fs');
          const board = require('./daily-board.js');
          const now = Date.now();
          const moscow = new Date(now + 3 * 60 * 60 * 1000);
          const minute = moscow.getUTCHours() * 60 + moscow.getUTCMinutes();
          const gameDay = board.gameDayKeyMsk(now);
          const snapshot = JSON.parse(fs.readFileSync('data.json', 'utf8'));
          const artifactExists = fs.existsSync(`analysis/doubles_${gameDay}.json`);
          const should = minute >= 570 && snapshot.date === gameDay && !artifactExists;
          console.error(`minute=${minute} snapshot=${snapshot.date} gameDay=${gameDay} artifact=${artifactExists} -> chain=${should}`);
          process.stdout.write(should ? gameDay : '');
          NODE
          )
          if [ -n "$CHAIN" ]; then
            curl --fail --silent --show-error -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/acquire-bookmaker-lines.yml/dispatches" \
              -d "{\"ref\":\"main\",\"inputs\":{\"date\":\"$CHAIN\"}}"
            echo "Chained coupon acquisition for $CHAIN"
          else
            echo "No chain dispatch needed"
          fi
