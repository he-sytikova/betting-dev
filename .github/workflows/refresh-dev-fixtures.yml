name: Refresh dev fixture schedule

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/refresh-dev-fixtures.yml"
  schedule:
    # Keep the dev model's fixture calendar in sync with the public production snapshot.
    - cron: '17 */2 * * *'

permissions:
  contents: write

concurrency:
  group: refresh-dev-fixtures
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download latest production prediction snapshot
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --retry 4 --retry-delay 5 \
            https://raw.githubusercontent.com/he-sytikova/betting/main/data.json \
            --output data.json
          node -e "
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('data.json', 'utf8'));
            if (!data.date || !Array.isArray(data.predictions)) {
              throw new Error('Production data.json must contain date and predictions[]');
            }
            const future = data.predictions.filter(item => {
              const time = Date.parse(item.time);
              return Number.isFinite(time) && time > Date.now();
            });
            if (future.length === 0) {
              throw new Error('Production snapshot has no upcoming fixtures; refusing to replace dev data');
            }
            console.log('Snapshot date:', data.date);
            console.log('Generated at:', data.generatedAt || 'unknown');
            console.log('Prediction records:', data.predictions.length);
            console.log('Upcoming fixture records:', future.length);
          "

      - name: Fetch Euro365 bookmaker odds for the snapshot day
        env:
          EURO365_API_KEY: ${{ secrets.EURO365_API_KEY }}
        run: python3 scripts/models/fetch-euro365-odds.py --data data.json --output data/odds.json

      - name: Archive completed results from non-CSV provider feed
        run: node scripts/models/archive-provider-results.mjs

      - name: Commit refreshed schedule and results archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          if [ -f data/odds.json ]; then git add data/odds.json; fi
          if [ -d data/results-ledger ]; then git add -A data/results-ledger; fi
          if git diff --cached --quiet; then
            echo "Fixture snapshot and completed-results archive are already current"
          else
            git commit -m "chore: refresh dev fixtures and archive results"
            git pull --rebase origin main
            git push
          fi
