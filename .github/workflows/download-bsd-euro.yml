name: Download BSD euro-cup history (diagnostic)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download CL/EL/ECL history from BSD
        env:
          BSD_TOKEN: ${{ secrets.BSD_TOKEN }}
        run: python scripts/models/download-bsd-euro.py --output-dir data/raw-bsd
