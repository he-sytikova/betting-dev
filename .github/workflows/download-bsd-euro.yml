name: "Загрузка истории еврокубков BSD (диагностика)"

on:
  workflow_dispatch:
    inputs:
      with_stats:
        description: "Догрузить статистику матчей (угловые/ЖК/КК) для всех матчей"
        type: boolean
        default: false
      stats_sample:
        description: "Разведка формата: статистика только для N последних матчей каждого сезона"
        type: string
        default: "0"

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download CL/EL/ECL history from BSD
        env:
          BSD_TOKEN: ${{ secrets.BSD_TOKEN }}
        run: |
          FLAGS=""
          if [ "${{ inputs.with_stats }}" = "true" ]; then FLAGS="$FLAGS --with-stats"; fi
          if [ "${{ inputs.stats_sample }}" != "0" ]; then FLAGS="$FLAGS --stats-sample ${{ inputs.stats_sample }}"; fi
          python scripts/models/download-bsd-euro.py --output-dir data/raw-bsd $FLAGS
