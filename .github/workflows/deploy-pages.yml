name: "Публикация сайта разработки на GitHub Pages"

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "*.html"
      - "*.js"
      - "*.css"
      - "data.json"
      - "data/*.json"
      - "data/results/*.json"
      - "analysis/*.json"
      - ".github/workflows/deploy-pages.yml"
  # Коммиты ботов (Refresh/Retrain) не триггерят push-ивенты, поэтому
  # деплоим и по успешному завершению этих workflow — иначе сайт
  # продолжает отдавать вчерашний снимок.
  workflow_run:
    workflows: ["Обновление календаря и модельного снимка", "Переобучение внутренних моделей", "Получение консенсуса The Odds API", "Получение матчей на выбранную дату", "Формирование купонов"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  # Upload и Deploy разнесены по разным job намеренно: deploy-pages@v4
  # запрашивает метаданные артефакта сразу после upload-pages-artifact,
  # и в одном job бэкенд артефактов периодически не успевает его
  # проиндексировать — run падает с "Found 0 artifact(s)" при фактически
  # загруженном артефакте. Граница между job гарантирует, что артефакт
  # github-pages уже доступен к моменту деплоя. Второй одноимённый
  # артефакт при этом не создаётся.
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
