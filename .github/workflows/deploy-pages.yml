name: Deploy dev preview to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "*.html"
      - "*.js"
      - "styles.css"
      - "data.json"
      - "data/*.json"
      - ".github/workflows/deploy-pages.yml"
  # Коммиты ботов (Refresh/Retrain) не триггерят push-ивенты, поэтому
  # деплоим и по успешному завершению этих workflow — иначе сайт
  # продолжает отдавать вчерашний снимок.
  workflow_run:
    workflows: ["Refresh dev fixture schedule", "Retrain internal models", "Fetch The Odds API consensus"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
