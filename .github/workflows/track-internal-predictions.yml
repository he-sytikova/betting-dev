name: Track internal model predictions (paused)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paused:
    runs-on: ubuntu-latest
    steps:
      - name: Explain pause
        run: |
          echo "Capturing predictions from the previous CSV-trained experimental models is disabled."
          echo "Forward testing will resume only after a model trained exclusively on non-CSV data is available."
