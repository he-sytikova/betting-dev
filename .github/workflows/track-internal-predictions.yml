name: Track internal model predictions

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: internal-model-prediction-ledger
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium
      - name: Capture pre-match internal model forecasts
        run: node scripts/models/capture-predictions.mjs
      - name: Commit prediction ledger
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prediction-ledger/
          if git diff --cached --quiet; then
            echo "No new forecast records."
          else
            git commit -m "chore: archive internal model predictions"
            git push
          fi
