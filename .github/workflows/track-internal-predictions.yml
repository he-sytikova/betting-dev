name: Track internal model predictions

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/models/capture-predictions.mjs"
      - "scripts/models/evaluate-predictions.py"
      - ".github/workflows/track-internal-predictions.yml"
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: internal-model-prediction-ledger
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium
      - name: Capture pre-match internal model forecasts
        run: node scripts/models/capture-predictions.mjs
      - name: Set up Python for results evaluation
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Evaluate forecasts against completed results
        run: python scripts/models/evaluate-predictions.py
      - name: Commit prediction ledger and evaluation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prediction-ledger/
          if git diff --cached --quiet; then
            echo "No new forecast or evaluation changes."
            exit 0
          fi
          git commit -m "chore: update internal prediction ledger"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          echo "Push failed after three rebase attempts."
          exit 1
