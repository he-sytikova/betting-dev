name: Probe FDO euro-cup access

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install pandas

      - name: Probe CL/EL/ECL availability and team coverage
        env:
          FDO_TOKEN: ${{ secrets.FDO_TOKEN }}
        run: python scripts/models/probe-fdo-euro.py --output data/fdo_euro_probe.json

      - name: Commit probe report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fdo_euro_probe.json
          if git diff --cached --quiet; then
            echo "Probe report is already current"
          else
            git commit -m "chore: FDO euro-cup probe report"
            git pull --rebase origin main
            git push
          fi
