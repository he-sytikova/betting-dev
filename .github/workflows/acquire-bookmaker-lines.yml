name: "Формирование купонов"

# Read-only line acquisition. No bet placement or financial accounting.
# The only committable result is analysis/doubles_YYYY-MM-DD.json.
on:
  workflow_dispatch:
    inputs:
      date:
        description: "Moscow date YYYY-MM-DD (blank = today; must match data.json)"
        required: false
        type: string
      detail_limit:
        description: "Maximum matched BK-event detail requests (0..40)"
        required: false
        default: "40"
        type: string
  schedule:
    - cron: "35 6 * * *" # 09:35 Moscow, after the 09:17 fixture refresh.

permissions:
  contents: write

concurrency:
  group: daily-coupon-pipeline
  cancel-in-progress: false

jobs:
  acquire:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the pinned read-only browser dependency
        run: |
          python3 -m pip install --requirement scripts/lines/requirements-winline.txt
          python3 -m playwright install --with-deps chromium

      - name: Test acquisition, pricing and homepage contracts
        run: |
          python3 -m unittest tests.test_odds_acquisition tests.test_winline_acquisition -v
          node --test tests/daily-coupons.test.cjs tests/daily-board.test.cjs

      - name: Resolve Moscow date
        id: date
        env:
          INPUT_DATE: ${{ inputs.date }}
        run: |
          DATE="${INPUT_DATE:-$(TZ=Europe/Moscow date +%F)}"
          echo "$DATE" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' || { echo "Invalid date: $DATE"; exit 1; }
          echo "date=$DATE" >> "$GITHUB_OUTPUT"

      - name: Validate detail limit
        env:
          LIMIT: ${{ inputs.detail_limit || '40' }}
        run: |
          echo "$LIMIT" | grep -Eq '^([0-9]|[1-3][0-9]|40)$' || { echo "Invalid detail limit: $LIMIT"; exit 1; }
          echo "limit=$LIMIT" >> "$GITHUB_ENV"

      - name: Validate current model snapshot
        env:
          TARGET_DATE: ${{ steps.date.outputs.date }}
        run: |
          node - "$TARGET_DATE" <<'NODE'
          const fs = require('node:fs');
          const targetDate = process.argv[2];
          const data = JSON.parse(fs.readFileSync('data.json', 'utf8'));
          if (!data || !Array.isArray(data.predictions)) {
            throw new Error('data.json must contain predictions[]');
          }
          if (data.date !== targetDate) {
            throw new Error(`Stale snapshot: data.json date=${data.date}, requested=${targetDate}; no coupon artifact will be published`);
          }
          console.log(`Current snapshot accepted: ${targetDate}, records=${data.predictions.length}`);
          NODE

      - name: Acquire fresh lines and matched detail markets
        run: python3 scripts/acquire_bookmaker_lines.py --date "${{ steps.date.outputs.date }}" --fixtures data.json --detail-limit "$limit" --output "probe-out/lines_${{ steps.date.outputs.date }}"

      - name: Build dated homepage artifact
        run: node scripts/lines/build_daily_coupons.cjs --data data.json --acquisition "probe-out/lines_${{ steps.date.outputs.date }}" --output "analysis/doubles_${{ steps.date.outputs.date }}.json"

      - name: Validate homepage artifact and source status
        env:
          TARGET_DATE: ${{ steps.date.outputs.date }}
        run: |
          node - "$TARGET_DATE" <<'NODE'
          const fs = require('node:fs');
          const board = require('./daily-board.js');
          const targetDate = process.argv[2];
          const directory = `probe-out/lines_${targetDate}`;
          const artifact = JSON.parse(fs.readFileSync(`analysis/doubles_${targetDate}.json`, 'utf8'));
          const summary = JSON.parse(fs.readFileSync(`${directory}/summary.json`, 'utf8'));
          if (artifact.date !== targetDate) throw new Error('Homepage artifact date mismatch');
          if (!['not_processed', 'source_unavailable', 'no_line_match', 'ok'].includes(artifact.data_status)) {
            throw new Error(`Unsupported data_status: ${artifact.data_status}`);
          }
          const statuses = Object.values(summary.bookmakers || {}).map(item => item.status);
          const available = statuses.some(status => ['ok', 'partial'].includes(status));
          const hasMatch = (summary.matching?.matched || 0) > 0;
          const expectedStatus = !available ? 'source_unavailable' : (!hasMatch ? 'no_line_match' : 'ok');
          if (artifact.data_status !== expectedStatus) {
            throw new Error(`Expected ${expectedStatus}, got ${artifact.data_status}`);
          }
          for (const [name, source] of Object.entries(artifact.sources || {})) {
            if (['ok', 'partial'].includes(source.status) && !source.captured_at_utc) {
              throw new Error(`${name}: capture time is missing`);
            }
          }
          const normalized = board.normalizeCoupons(artifact);
          if (normalized.rejected.length) throw new Error(`Homepage rejected coupons: ${normalized.rejected}`);
          const coupons = artifact.prepared_coupons || [];
          if (normalized.coupons.length !== coupons.length) throw new Error('Coupon normalization count mismatch');
          const sessionCounts = Object.fromEntries(board.GAME_SESSIONS.map(session => [session.id, { single: 0, double: 0 }]));
          const forbidden = new Set(['amount', 'stake', 'placed', 'is_placed', 'financial_result']);
          function inspect(value) {
            if (!value || typeof value !== 'object') return;
            for (const [key, child] of Object.entries(value)) {
              if (forbidden.has(key)) throw new Error(`Financial/placed field is forbidden: ${key}`);
              inspect(child);
            }
          }
          inspect(coupons);
          for (const coupon of coupons) {
            if (coupon.status !== 'prepared') throw new Error('Every coupon must remain prepared, not placed');
            if (!['single', 'double'].includes(coupon.type)) throw new Error('Unsupported coupon type');
            const session = board.gameSessionForTime(coupon.legs?.[0]?.time);
            if (!session || coupon.session_id !== session.id) throw new Error('Coupon session mismatch');
            if (coupon.legs.some(leg => board.gameSessionForTime(leg.time)?.id !== session.id)) {
              throw new Error('Coupon legs cross game sessions');
            }
            sessionCounts[session.id][coupon.type] += 1;
            const limit = coupon.type === 'single' ? 2 : 1;
            if (sessionCounts[session.id][coupon.type] > limit) {
              throw new Error(`${session.id} ${coupon.type} limit exceeded`);
            }
            for (const leg of coupon.legs || []) {
              if (!(leg.p_model >= board.MIN_PROBABILITY - 1e-12) || !(leg.ev >= board.EV_MIN - 1e-12)) throw new Error('Ineligible model probability or EV');
              if (!(Math.abs(leg.delta_pp) < 15 - 1e-12)) throw new Error('Delta anomaly in published coupon');
              if (!(leg.odds >= leg.o_min_step - 1e-12)) throw new Error('Price below rounded minimum');
              if (/^(ТБ|ИТБ1|ИТБ2)/.test(leg.label) && !(leg.p_model >= leg.fair - 1e-12)) throw new Error('Over selection below fair');
            }
            if (coupon.type === 'double') {
              if (new Set(coupon.legs.map(leg => leg.bookmaker)).size !== 1) throw new Error('Double mixes bookmakers');
              if (new Set(coupon.legs.map(leg => leg.model_key)).size !== coupon.legs.length) throw new Error('Double repeats a match');
            }
          }
          console.log(`Homepage artifact accepted: ${artifact.data_status}, coupons=${coupons.length}`);
          if (!available) console.warn('All bookmakers unavailable; source_unavailable artifact will be published');
          NODE

      - name: Upload raw responses, snapshots and audit
        if: always() && steps.date.outputs.date != ''
        uses: actions/upload-artifact@v4
        with:
          name: bookmaker-lines-${{ steps.date.outputs.date }}
          path: probe-out/lines_${{ steps.date.outputs.date }}/
          retention-days: 90
          if-no-files-found: warn

      - name: Commit only the dated homepage artifact
        if: success()
        env:
          TARGET_DATE: ${{ steps.date.outputs.date }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ARTIFACT="analysis/doubles_${TARGET_DATE}.json"
          test -f "$ARTIFACT"
          git add -- "$ARTIFACT"
          if git diff --cached --quiet; then
            echo "Homepage artifact is already current"
          else
            test "$(git diff --cached --name-only)" = "$ARTIFACT"
            git commit -m "chore: update prepared coupons for ${TARGET_DATE}"
            git pull --rebase origin main
            git push
          fi
