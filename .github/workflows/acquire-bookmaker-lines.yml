name: Acquire bookmaker lines

# Read-only line acquisition. No repository commits, coupons or bet placement.
on:
  workflow_dispatch:
    inputs:
      date:
        description: "Moscow date YYYY-MM-DD (blank = today)"
        required: false
        type: string
      detail_limit:
        description: "Maximum matched BK-event detail requests (0..40)"
        required: false
        default: "40"
        type: string
  schedule:
    - cron: "0 6 * * *" # 09:00 Moscow, after the morning fixture refresh.

permissions:
  contents: read

concurrency:
  group: acquire-bookmaker-lines
  cancel-in-progress: false

jobs:
  acquire:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test acquisition parsers and matching
        run: python3 -m unittest tests.test_odds_acquisition -v

      - name: Resolve Moscow date
        id: date
        env:
          INPUT_DATE: ${{ inputs.date }}
        run: |
          DATE="${INPUT_DATE:-$(TZ=Europe/Moscow date +%F)}"
          echo "$DATE" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' || { echo "Invalid date: $DATE"; exit 1; }
          echo "date=$DATE" >> "$GITHUB_OUTPUT"

      - name: Validate detail limit
        env:
          LIMIT: ${{ inputs.detail_limit || '40' }}
        run: |
          echo "$LIMIT" | grep -Eq '^([0-9]|[1-3][0-9]|40)$' || { echo "Invalid detail limit: $LIMIT"; exit 1; }
          echo "limit=$LIMIT" >> "$GITHUB_ENV"

      - name: Acquire fresh lines and matched detail markets
        run: python3 scripts/acquire_bookmaker_lines.py --date "${{ steps.date.outputs.date }}" --fixtures data.json --detail-limit "$limit" --output "probe-out/lines_${{ steps.date.outputs.date }}"

      - name: Upload raw responses, snapshots and audit
        if: always() && steps.date.outputs.date != ''
        uses: actions/upload-artifact@v4
        with:
          name: bookmaker-lines-${{ steps.date.outputs.date }}
          path: probe-out/lines_${{ steps.date.outputs.date }}/
          retention-days: 90
          if-no-files-found: error

      - name: Fail when both bookmakers are unavailable
        if: always()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path("probe-out/lines_${{ steps.date.outputs.date }}/summary.json")
          if not path.is_file():
              raise SystemExit("Acquisition summary was not produced")
          summary = json.loads(path.read_text(encoding="utf-8"))
          statuses = [item["status"] for item in summary["bookmakers"].values()]
          if not any(status in ("ok", "partial") for status in statuses):
              raise SystemExit(f"Both bookmakers unavailable: {statuses}")
          PY
